name: Publish plugin release

on:
  push:
    branches: [main]
    paths:
      - plugin.json
      - releases/**
      - README.md
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read plugin version
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./plugin.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Extract release notes
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          awk -v heading="### v${version}" '
            $0 == heading { found = 1; next }
            found && /^### v/ { exit }
            found { print }
          ' README.md > /tmp/release-notes.md

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          tag="v${VERSION}"
          asset="releases/folder-browser-v${VERSION}.jsplugin.zip"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
            gh release edit "$tag" --title "$tag" --notes-file /tmp/release-notes.md
          else
            gh release create "$tag" "$asset#folder-browser-v${VERSION}.jsplugin.zip" \
              --target "$GITHUB_SHA" \
              --title "$tag" \
              --notes-file /tmp/release-notes.md
          fi
